import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

def moduleRoot = file('modules/resonance-device')
def lockFile = file('modules.lock.json')
def moduleResources = new File(moduleRoot, 'src/main/resources')
def moduleLanguages = fileTree(new File(moduleResources, 'assets/writ/lang')) { include '*.json' }

sourceSets.main.java.srcDir(new File(moduleRoot, 'src/main/java'))

def verifyResonanceSnapshot = tasks.register('verifyResonanceSnapshot') {
    inputs.file(lockFile)
    inputs.dir(moduleRoot)
    doLast {
        def lock = new JsonSlurper().parse(lockFile, 'UTF-8')
        def snapshot = lock.modules['resonance-device']
        def paths = fileTree(moduleRoot).files.collect {
            moduleRoot.toPath().relativize(it.toPath()).toString().replace('\\', '/')
        }.toSet()
        if (lock.schema != 1 || paths != snapshot.files.keySet()) {
            throw new GradleException('Resonance snapshot files do not match modules.lock.json')
        }
        snapshot.files.each { path, expected ->
            def bytes = new File(moduleRoot, path).bytes
            def actual = MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
            if (actual != expected) throw new GradleException("Resonance snapshot hash mismatch: ${path}")
        }
    }
}

tasks.named('compileJava') { dependsOn verifyResonanceSnapshot }
tasks.named('processResources') {
    dependsOn verifyResonanceSnapshot
    inputs.files(moduleLanguages)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(moduleResources) { exclude 'assets/writ/lang/**' }
    doLast {
        moduleLanguages.files.sort { it.name }.each { fragment ->
            def destination = new File(destinationDir, "assets/writ/lang/${fragment.name}")
            def parser = new JsonSlurper()
            def host = parser.parse(file("src/main/resources/assets/writ/lang/${fragment.name}"), 'UTF-8')
            def moduleKeys = parser.parse(fragment, 'UTF-8')
            def conflicts = host.keySet().intersect(moduleKeys.keySet())
            if (conflicts) throw new GradleException("Resonance translation conflict in ${fragment.name}: ${conflicts}")
            destination.setText(JsonOutput.prettyPrint(JsonOutput.toJson(host + moduleKeys)) + '\n', 'UTF-8')
        }
    }
}
